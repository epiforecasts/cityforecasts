name: Submit to hub

# Opens a PR into the flu-metrocast hub when a forecast is merged into main
# (i.e. after the weekly forecast PR has been reviewed and merged)
on:
  push:
    branches: [main]
    paths:
      - "output/cityforecasts/*/*-epiforecasts-dyngam.parquet"
  workflow_dispatch:
    inputs:
      forecast_date:
        description: "Forecast date (YYYY-MM-DD) to submit; the forecast must be on main"
        required: true

permissions:
  contents: read

concurrency:
  group: submit-to-hub
  cancel-in-progress: false

jobs:
  submit:
    runs-on: ubuntu-latest
    env:
      # Classic personal access token with the public_repo scope, from an
      # account that can push to HUB_FORK
      HUB_TOKEN: ${{ secrets.HUB_PR_TOKEN }}
      HUB_FORK: kaitejohnson/flu-metrocast
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Find forecast dates to submit
        id: dates
        env:
          INPUT_DATE: ${{ inputs.forecast_date }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [[ -n "$INPUT_DATE" ]]; then
            dates="$INPUT_DATE"
          else
            # Forecasts added by this push, ignoring non-date directories
            # (e.g. 2026-10-07_manual)
            dates=$(git diff --name-only --diff-filter=A "$BEFORE" "$GITHUB_SHA" \
              -- 'output/cityforecasts/*/*-epiforecasts-dyngam.parquet' \
              | cut -d/ -f3 | grep -E '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' | sort -u)
          fi
          echo "Forecast dates to submit: ${dates:-none}"
          echo "dates=$(echo $dates)" >>"$GITHUB_OUTPUT"

      - name: Open hub PRs
        if: steps.dates.outputs.dates != ''
        env:
          DATES: ${{ steps.dates.outputs.dates }}
        run: |
          [[ -n "$HUB_TOKEN" ]] || { echo "::error::HUB_PR_TOKEN secret is not set"; exit 1; }
          status=0
          for d in $DATES; do
            FORECAST_DATE="$d" bin/submit_to_hub.sh || status=1
          done
          exit $status
